name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check .

      - name: Run lint checks
        run: python -m ruff check .

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinebot_test
          POSTGRES_USER: cinebot
          POSTGRES_PASSWORD: cinebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinebot -d cinebot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cinebot:cinebot_test@127.0.0.1:5432/cinebot_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REQUIRE_REDIS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate deployment manifests and container
        run: |
          docker compose config --quiet
          docker build --tag cinebot-ci .

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Verify PostgreSQL and Redis readiness
        run: |
          python -c "from src.persistence import Database; assert Database(create_schema=False).health()['status'] == 'ok'"
          python -c "from src.rate_limit import RateLimiter; assert RateLimiter().health() == {'status': 'ok', 'backend': 'redis'}"

      - name: Run persistence integration tests
        run: python -m pytest -q tests/test_persistence.py
