services:
  api:
    build: .
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "8000:8000"

  ui:
    build: .
    command:
      - streamlit
      - run
      - src/frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      CINEBOT_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
