# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: keyvalue
    name: cinebot-cache
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: cinebot-api
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health/ready
    dockerCommand: /bin/sh -c 'alembic upgrade head && exec uvicorn src.app:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinebot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cinebot-cache
          property: connectionString
      - key: REQUIRE_REDIS
        value: "true"
      - key: TMDB_API_KEY
        sync: false

  - type: web
    name: cinebot-ui
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /_stcore/health
    dockerCommand: /bin/sh -c 'streamlit run src/frontend/streamlit_app.py --server.address=0.0.0.0 --server.port ${PORT:-8501}'
    envVars:
      - key: CINEBOT_API_URL
        fromService:
          type: web
          name: cinebot-api
          property: hostport

databases:
  - name: cinebot-db
    plan: free
    region: ohio
    databaseName: cinebot
    user: cinebot
